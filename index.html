<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Final Exam Flashcards</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 6px;
      color: #a78bfa;
      letter-spacing: 1px;
      text-align: center;
    }

    .subtitle {
      font-size: 0.88rem;
      color: #888;
      margin-bottom: 20px;
      text-align: center;
    }

    /* Unit filter pills */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 24px;
      max-width: 600px;
    }

    .pill {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
      border: 1.5px solid transparent;
      background: #2d2d50;
      color: #aaa;
      transition: all 0.18s;
    }

    .pill:hover { background: #3d3d6b; color: #eee; }

    .pill.active {
      background: #4f46e5;
      color: #fff;
      border-color: #7c3aed;
    }

    .pill.quickset {
      background: #1e1a00;
      color: #fbbf24;
      border-color: #b45309;
    }

    .pill.quickset.active {
      background: #92400e;
      color: #fef3c7;
      border-color: #fbbf24;
    }

    /* Card */
    .card-container {
      perspective: 1200px;
      width: 460px;
      max-width: 92vw;
      height: 250px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s ease;
    }

    .card.flipped { transform: rotateY(180deg); }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 32px;
      text-align: center;
    }

    .card-front {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      box-shadow: 0 8px 32px rgba(79,70,229,0.4);
    }

    .card-back {
      background: linear-gradient(135deg, #0f766e, #0891b2);
      transform: rotateY(180deg);
      box-shadow: 0 8px 32px rgba(8,145,178,0.4);
    }

    .card-unit-tag {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      opacity: 0.6;
      margin-bottom: 6px;
    }

    .card-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      opacity: 0.7;
      margin-bottom: 10px;
    }

    .card-term {
      font-size: 1.45rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .card-def {
      font-size: 1rem;
      line-height: 1.55;
    }

    .hint {
      margin-top: 10px;
      font-size: 0.73rem;
      opacity: 0.5;
    }

    /* Know / Learn buttons */
    .know-btns {
      display: none;
      gap: 14px;
      margin-top: 20px;
    }

    .know-btns.visible { display: flex; }

    .btn-know {
      background: #14532d;
      color: #4ade80;
      border: 1.5px solid #22c55e;
      border-radius: 12px;
      padding: 10px 22px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-know:hover { background: #166534; transform: scale(1.04); }

    .btn-learn {
      background: #431407;
      color: #fb923c;
      border: 1.5px solid #f97316;
      border-radius: 12px;
      padding: 10px 22px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-learn:hover { background: #7c2d12; transform: scale(1.04); }

    /* Score row */
    .score-row {
      display: flex;
      gap: 24px;
      margin-top: 16px;
      font-size: 0.88rem;
    }

    .score-know { color: #4ade80; }
    .score-learn { color: #fb923c; }

    /* Nav controls */
    .controls {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 18px;
    }

    button {
      background: #2d2d50;
      color: #eee;
      border: none;
      border-radius: 10px;
      padding: 10px 22px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background: #3d3d6b; }
    button:disabled { opacity: 0.3; cursor: default; }

    .counter {
      font-size: 0.95rem;
      color: #a78bfa;
      min-width: 70px;
      text-align: center;
    }

    .bottom-btns {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .shuffle-btn {
      background: transparent;
      border: 1px solid #4f46e5;
      color: #a78bfa;
      font-size: 0.8rem;
      padding: 7px 16px;
      border-radius: 10px;
    }

    .shuffle-btn:hover { background: #1e1b4b; }

    /* Progress dots */
    .progress {
      display: flex;
      gap: 5px;
      margin-top: 18px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 460px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #2d2d50;
      transition: background 0.3s;
      flex-shrink: 0;
    }

    .dot.know { background: #22c55e; }
    .dot.learn { background: #f97316; }
    .dot.current { background: #a78bfa; }

    /* Done screen */
    .done-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 14px;
      max-width: 460px;
    }

    .done-screen.visible { display: flex; }

    .done-title { font-size: 1.8rem; font-weight: 700; color: #a78bfa; }
    .done-stats { font-size: 1.1rem; line-height: 2; }

    .restart-btn {
      background: #4f46e5;
      border: none;
      padding: 12px 28px;
      border-radius: 12px;
      font-size: 1rem;
      cursor: pointer;
      color: #fff;
    }

    .restart-btn:hover { background: #4338ca; }

    .study-again-btn {
      background: #431407;
      border: 1.5px solid #f97316;
      color: #fb923c;
      padding: 12px 28px;
      border-radius: 12px;
      font-size: 1rem;
      cursor: pointer;
    }

    .study-again-btn:hover { background: #7c2d12; }
  </style>
</head>
<body>

  <h1>Final Exam Review</h1>
  <p class="subtitle">Click a card to flip &bull; Mark yourself &bull; Study what you need</p>

  <div class="filters" id="filters"></div>

  <div id="main">
    <div class="card-container" onclick="flipCard()">
      <div class="card" id="card">
        <div class="card-face card-front">
          <div class="card-unit-tag" id="unitTag"></div>
          <div class="card-label">Term</div>
          <div class="card-term" id="term"></div>
          <div class="hint">tap to reveal</div>
        </div>
        <div class="card-face card-back">
          <div class="card-label">Definition</div>
          <div class="card-def" id="def"></div>
        </div>
      </div>
    </div>

    <div class="know-btns" id="knowBtns">
      <button class="btn-learn" onclick="markCard(false)">&#x2715; Still learning</button>
      <button class="btn-know" onclick="markCard(true)">&#x2713; Know it</button>
    </div>

    <div class="score-row">
      <span class="score-know">&#10003; Know it: <span id="knowCount">0</span></span>
      <span class="score-learn">&#x2715; Still learning: <span id="learnCount">0</span></span>
    </div>

    <div class="controls">
      <button id="prevBtn" onclick="navigate(-1)">&#8592; Prev</button>
      <span class="counter" id="counter"></span>
      <button id="nextBtn" onclick="navigate(1)">Next &#8594;</button>
    </div>

    <div class="bottom-btns">
      <button class="shuffle-btn" onclick="shuffle()">&#x1F500; Shuffle</button>
    </div>

    <div class="progress" id="progress"></div>
  </div>

  <div class="done-screen" id="doneScreen">
    <div class="done-title">Nice work!</div>
    <div class="done-stats" id="doneStats"></div>
    <button class="restart-btn" onclick="restart(false)">&#x1F504; Restart all cards</button>
    <button class="study-again-btn" onclick="restart(true)">&#x1F4DA; Study &ldquo;Still learning&rdquo; again</button>
  </div>

      { unit: "Unit 5: Enlightenment", term: "Rousseau", def: "People are naturally good — society corrupts them" },
      { unit: "Unit 5: Enlightenment", term: "Montesquieu", def: "Government should have separation of powers to prevent tyranny" },
      { unit: "Unit 5: Enlightenment", term: "Beccaria", def: "Against torture and cruel punishments" },
      { unit: "Unit 5: Enlightenment", term: "Adam Smith", def: "Father of capitalism and the free market" },
      { unit: "Unit 5: Enlightenment", term: "The Social Contract", def: "Agreement between the people and government — people give up some freedom in exchange for protection" },

      // ── UNIT 5: American Revolution ─────────────────────────────────
      { unit: "Unit 5: American Revolution", term: "Thomas Jefferson", def: "Wrote the Declaration of Independence" },
      { unit: "Unit 5: American Revolution", term: "Bill of Rights", def: "First 10 amendments to the U.S. Constitution — protected individual freedoms" },
      { unit: "Unit 5: American Revolution", term: "Causes of the American Revolution", def: "Taxation without representation" },
      { unit: "Unit 5: American Revolution", term: "King George III", def: "British king who refused to address the colonists' complaints" },
      { unit: "Unit 5: American Revolution", term: "George Washington", def: "Led the Continental Army and became the first President of the United States" },

      // ── UNIT 5: French Revolution ───────────────────────────────────
      { unit: "Unit 5: French Revolution", term: "Causes of the French Revolution", def: "Inequality between the estates and France going bankrupt from wars" },
      { unit: "Unit 5: French Revolution", term: "Estates-General", def: "Meeting of all three estates called by Louis XVI" },
      { unit: "Unit 5: French Revolution", term: "National Assembly", def: "The Third Estate broke away and formed their own government" },
      { unit: "Unit 5: French Revolution", term: "Jacobins", def: "Radical revolutionary group that led the Reign of Terror" },
      { unit: "Unit 5: French Revolution", term: "1st, 2nd, and 3rd Estate", def: "1st: Clergy | 2nd: Nobles | 3rd: Everyone else — who paid all the taxes" },
      { unit: "Unit 5: French Revolution", term: "Old Regime", def: "The pre-revolution social and political system in France" },
      { unit: "Unit 5: French Revolution", term: "Deficit Spending", def: "Government spending more money than it earns" },
      { unit: "Unit 5: French Revolution", term: "King Louis XVI", def: "Weak French king during the Revolution" },
      { unit: "Unit 5: French Revolution", term: "Marie Antoinette", def: "Queen of France during the Revolution" },
      { unit: "Unit 5: French Revolution", term: "Robespierre", def: "Led the Reign of Terror — was eventually executed himself" },
      { unit: "Unit 5: French Revolution", term: "Guillotine", def: "Device used for beheadings during the French Revolution" },
      { unit: "Unit 5: French Revolution", term: "Reign of Terror", def: "Period during the French Revolution when thousands were executed" },
      { unit: "Unit 5: French Revolution", term: "Napoleon", def: "Military general who took power after the Revolution — conquered much of Europe and spread French laws and ideas" },
    ];

    // Build unique unit list (preserving order)
    const unitOrder = [];
    ALL_CARDS.forEach(c => { if (!unitOrder.includes(c.unit)) unitOrder.push(c.unit); });

    let activeUnits = new Set(unitOrder); // all active by default
    let quickSetActive = false;
    let cards = [];
    let index = 0;
    let status = {};
    let flipped = false;

    // Build filter pills
    const filtersEl = document.getElementById('filters');

    function buildPills() {
      filtersEl.innerHTML = '';

      // Quick Set pill
      const qsPill = document.createElement('div');
      qsPill.className = 'pill quickset' + (quickSetActive ? ' active' : '');
      qsPill.textContent = '⭐ Enlightenment Quick Set';
      qsPill.onclick = () => {
        quickSetActive = !quickSetActive;
        if (quickSetActive) activeUnits = new Set(); // deselect units
        else activeUnits = new Set(unitOrder);
        refreshPills();
        applyFilter();
      };
      filtersEl.appendChild(qsPill);

      // "All" pill
      const allPill = document.createElement('div');
      allPill.className = 'pill' + (!quickSetActive && activeUnits.size === unitOrder.length ? ' active' : '');
      allPill.textContent = 'All';
      allPill.onclick = () => {
        quickSetActive = false;
        activeUnits = new Set(unitOrder);
        refreshPills();
        applyFilter();
      };
      filtersEl.appendChild(allPill);

      unitOrder.forEach(u => {
        const p = document.createElement('div');
        p.className = 'pill' + (!quickSetActive && activeUnits.has(u) ? ' active' : '');
        p.textContent = u.replace('Unit ', 'U').replace(': ', ' – ');
        p.onclick = () => {
          quickSetActive = false;
          if (activeUnits.has(u)) {
            if (activeUnits.size === 1) return;
            activeUnits.delete(u);
          } else {
            activeUnits.add(u);
          }
          refreshPills();
          applyFilter();
        };
        filtersEl.appendChild(p);
      });
    }

    function refreshPills() {
      const pills = filtersEl.querySelectorAll('.pill');
      // Quick set pill (index 0)
      pills[0].className = 'pill quickset' + (quickSetActive ? ' active' : '');
      // All pill (index 1)
      pills[1].className = 'pill' + (!quickSetActive && activeUnits.size === unitOrder.length ? ' active' : '');
      // Unit pills (index 2+)
      unitOrder.forEach((u, i) => {
        pills[i + 2].className = 'pill' + (!quickSetActive && activeUnits.has(u) ? ' active' : '');
      });
    }

    function applyFilter() {
      if (quickSetActive) {
        cards = [...QUICK_SET];
      } else {
        cards = ALL_CARDS.filter(c => activeUnits.has(c.unit));
      }
      index = 0;
      status = {};
      render();
    }

    function render() {
      if (cards.length === 0) return;
      const card = cards[index];
      document.getElementById('unitTag').textContent = card.unit;
      document.getElementById('term').textContent = card.term;
      document.getElementById('def').textContent = card.def;
      document.getElementById('counter').textContent = `${index + 1} / ${cards.length}`;
      document.getElementById('prevBtn').disabled = index === 0;
      document.getElementById('nextBtn').disabled = index === cards.length - 1;

      flipped = false;
      document.getElementById('card').classList.remove('flipped');
      document.getElementById('knowBtns').classList.remove('visible');

      updateScoreDisplay();
      renderDots();
    }

    function updateScoreDisplay() {
      const vals = Object.values(status);
      document.getElementById('knowCount').textContent = vals.filter(v => v === 'know').length;
      document.getElementById('learnCount').textContent = vals.filter(v => v === 'learn').length;
    }

    function renderDots() {
      const prog = document.getElementById('progress');
      prog.innerHTML = '';
      cards.forEach((_, i) => {
        const d = document.createElement('div');
        let cls = 'dot';
        if (i === index) cls += ' current';
        else if (status[i] === 'know') cls += ' know';
        else if (status[i] === 'learn') cls += ' learn';
        d.className = cls;
        prog.appendChild(d);
      });
    }

    function flipCard() {
      flipped = !flipped;
      document.getElementById('card').classList.toggle('flipped');
      if (flipped) document.getElementById('knowBtns').classList.add('visible');
    }

    function markCard(known) {
      status[index] = known ? 'know' : 'learn';
      updateScoreDisplay();
      renderDots();
      const next = index + 1;
      if (next < cards.length) { index = next; render(); }
      else showDone();
    }

    function navigate(dir) {
      const next = index + dir;
      if (next >= 0 && next < cards.length) { index = next; render(); }
    }

    function shuffle() {
      for (let i = cards.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cards[i], cards[j]] = [cards[j], cards[i]];
      }
      index = 0;
      status = {};
      render();
    }

    function showDone() {
      const knowN = Object.values(status).filter(v => v === 'know').length;
      const learnN = Object.values(status).filter(v => v === 'learn').length;
      document.getElementById('main').style.display = 'none';
      document.getElementById('doneScreen').classList.add('visible');
      document.getElementById('doneStats').innerHTML =
        `<span style="color:#4ade80">&#10003; Know it: ${knowN}</span><br>` +
        `<span style="color:#fb923c">&#x2715; Still learning: ${learnN}</span>`;
      document.querySelector('.study-again-btn').style.display = learnN > 0 ? '' : 'none';
    }

    function restart(onlyLearning) {
      document.getElementById('main').style.display = '';
      document.getElementById('doneScreen').classList.remove('visible');
      if (onlyLearning) {
        const learnKeys = Object.keys(status).filter(k => status[k] === 'learn').map(Number);
        cards = learnKeys.map(k => cards[k]);
      } else {
        cards = quickSetActive ? [...QUICK_SET] : ALL_CARDS.filter(c => activeUnits.has(c.unit));
      }
      index = 0;
      status = {};
      render();
    }

    buildPills();
    applyFilter();
  </script>
</body>
</html>
