<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Final Exam Flashcards</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 6px;
      color: #a78bfa;
      letter-spacing: 1px;
      text-align: center;
    }

    .subtitle {
      font-size: 0.88rem;
      color: #888;
      margin-bottom: 20px;
      text-align: center;
    }

    /* Unit filter pills */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 24px;
      max-width: 600px;
    }

    .pill {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
      border: 1.5px solid transparent;
      background: #2d2d50;
      color: #aaa;
      transition: all 0.18s;
    }

    .pill:hover { background: #3d3d6b; color: #eee; }

    .pill.active {
      background: #4f46e5;
      color: #fff;
      border-color: #7c3aed;
    }

    .pill.quickset {
      background: #1e1a00;
      color: #fbbf24;
      border-color: #b45309;
    }

    .pill.quickset.active {
      background: #92400e;
      color: #fef3c7;
      border-color: #fbbf24;
    }

    /* Card */
    .card-container {
      perspective: 1200px;
      width: 460px;
      max-width: 92vw;
      height: 250px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s ease;
    }

    .card.flipped { transform: rotateY(180deg); }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 32px;
      text-align: center;
    }

    .card-front {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      box-shadow: 0 8px 32px rgba(79,70,229,0.4);
    }

    .card-back {
      background: linear-gradient(135deg, #0f766e, #0891b2);
      transform: rotateY(180deg);
      box-shadow: 0 8px 32px rgba(8,145,178,0.4);
    }

    .card-unit-tag {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      opacity: 0.6;
      margin-bottom: 6px;
    }

    .card-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      opacity: 0.7;
      margin-bottom: 10px;
    }

    .card-term {
      font-size: 1.45rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .card-def {
      font-size: 1rem;
      line-height: 1.55;
    }

    .hint {
      margin-top: 10px;
      font-size: 0.73rem;
      opacity: 0.5;
    }

    /* Know / Learn buttons — always visible */
    .know-btns {
      display: flex;
      gap: 14px;
      margin-top: 20px;
    }

    .btn-know {
      background: #14532d;
      color: #4ade80;
      border: 1.5px solid #22c55e;
      border-radius: 12px;
      padding: 10px 22px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-know:hover { background: #166534; transform: scale(1.04); }

    .btn-learn {
      background: #431407;
      color: #fb923c;
      border: 1.5px solid #f97316;
      border-radius: 12px;
      padding: 10px 22px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-learn:hover { background: #7c2d12; transform: scale(1.04); }

    /* Score row */
    .score-row {
      display: flex;
      gap: 24px;
      margin-top: 16px;
      font-size: 0.88rem;
    }

    .score-know { color: #4ade80; }
    .score-learn { color: #fb923c; }

    /* Nav controls */
    .controls {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 18px;
    }

    button {
      background: #2d2d50;
      color: #eee;
      border: none;
      border-radius: 10px;
      padding: 10px 22px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background: #3d3d6b; }
    button:disabled { opacity: 0.3; cursor: default; }

    .counter {
      font-size: 0.95rem;
      color: #a78bfa;
      min-width: 70px;
      text-align: center;
    }

    .bottom-btns {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .shuffle-btn {
      background: transparent;
      border: 1px solid #4f46e5;
      color: #a78bfa;
      font-size: 0.8rem;
      padding: 7px 16px;
      border-radius: 10px;
    }

    .shuffle-btn:hover { background: #1e1b4b; }

    /* Progress dots */
    .progress {
      display: flex;
      gap: 5px;
      margin-top: 18px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 460px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #2d2d50;
      transition: background 0.3s;
      flex-shrink: 0;
    }

    .dot.know { background: #22c55e; }
    .dot.learn { background: #f97316; }
    .dot.current { background: #a78bfa; }

    /* Done screen */
    .done-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 14px;
      max-width: 460px;
    }

    .done-screen.visible { display: flex; }

    .done-title { font-size: 1.8rem; font-weight: 700; color: #a78bfa; }
    .done-stats { font-size: 1.1rem; line-height: 2; }

    .restart-btn {
      background: #4f46e5;
      border: none;
      padding: 12px 28px;
      border-radius: 12px;
      font-size: 1rem;
      cursor: pointer;
      color: #fff;
    }

    .restart-btn:hover { background: #4338ca; }

    .study-again-btn {
      background: #431407;
      border: 1.5px solid #f97316;
      color: #fb923c;
      padding: 12px 28px;
      border-radius: 12px;
      font-size: 1rem;
      cursor: pointer;
    }

    .study-again-btn:hover { background: #7c2d12; }

    /* Save / Presets buttons */
    .save-btn {
      background: transparent;
      border: 1px solid #22c55e;
      color: #4ade80;
      font-size: 0.8rem;
      padding: 7px 14px;
      border-radius: 10px;
      cursor: pointer;
    }
    .save-btn:hover { background: #14532d; }

    .presets-btn {
      background: transparent;
      border: 1px solid #f59e0b;
      color: #fbbf24;
      font-size: 0.8rem;
      padding: 7px 14px;
      border-radius: 10px;
      cursor: pointer;
    }
    .presets-btn:hover { background: #1e1a00; }

    /* Auto-save indicator */
    .save-indicator {
      font-size: 0.75rem;
      color: #4ade80;
      opacity: 0;
      transition: opacity 0.4s;
      margin-top: 6px;
      height: 16px;
    }
    .save-indicator.visible { opacity: 1; }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.visible { display: flex; }

    .modal {
      background: #16213e;
      border: 1px solid #2d2d6b;
      border-radius: 18px;
      padding: 28px;
      width: 100%;
      max-width: 440px;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #a78bfa;
      margin-bottom: 16px;
    }

    .preset-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1a1a2e;
      border: 1px solid #2d2d50;
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 10px;
      gap: 10px;
    }

    .preset-name {
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 3px;
    }

    .preset-meta {
      font-size: 0.75rem;
      color: #888;
    }

    .preset-actions { display: flex; gap: 8px; flex-shrink: 0; }

    .preset-load-btn {
      background: #4f46e5;
      border: none;
      color: #fff;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.82rem;
    }
    .preset-load-btn:hover { background: #4338ca; }

    .preset-del-btn {
      background: #2d2d50;
      border: none;
      color: #f87171;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.82rem;
    }
    .preset-del-btn:hover { background: #3d1a1a; }
  </style>
</head>
<body>

  <h1>Final Exam Review</h1>
  <p class="subtitle">Mark a card anytime &bull; Click to flip and check the definition</p>

  <div class="filters" id="filters"></div>

  <div id="main">
    <div class="card-container" onclick="flipCard()">
      <div class="card" id="card">
        <div class="card-face card-front">
          <div class="card-unit-tag" id="unitTag"></div>
          <div class="card-label">Term</div>
          <div class="card-term" id="term"></div>
          <div class="hint">tap to reveal</div>
        </div>
        <div class="card-face card-back">
          <div class="card-label">Definition</div>
          <div class="card-def" id="def"></div>
        </div>
      </div>
    </div>

    <div class="know-btns" id="knowBtns">
      <button class="btn-learn" onclick="markCard(false)">&#x2715; Still learning</button>
      <button class="btn-know" onclick="markCard(true)">&#x2713; Know it</button>
    </div>

    <div class="score-row">
      <span class="score-know">&#10003; Know it: <span id="knowCount">0</span></span>
      <span class="score-learn">&#x2715; Still learning: <span id="learnCount">0</span></span>
    </div>

    <div class="controls">
      <button id="prevBtn" onclick="navigate(-1)">&#8592; Prev</button>
      <span class="counter" id="counter"></span>
      <button id="nextBtn" onclick="navigate(1)">Next &#8594;</button>
    </div>

    <div class="bottom-btns">
      <button class="shuffle-btn" onclick="shuffle()">&#x1F500; Shuffle</button>
      <button class="save-btn" onclick="openSaveModal()">&#x1F4BE; Save Preset</button>
      <button class="presets-btn" onclick="openPresetsModal()">&#x1F4C2; My Presets</button>
    </div>

    <div class="save-indicator" id="saveIndicator">&#x2713; Progress saved</div>
    <div class="progress" id="progress"></div>
  </div>

  <div class="done-screen" id="doneScreen">
    <div class="done-title">Nice work! &#x1F3AB;</div>
    <div class="done-stats" id="doneStats"></div>
    <button class="save-btn" style="padding:11px 22px;font-size:0.95rem;" onclick="openSaveModal()">&#x1F4BE; Save Progress as Preset</button>
    <button class="restart-btn" onclick="restart(false)">&#x1F504; Go back &amp; keep marks</button>
    <button class="study-again-btn" onclick="restart(true)">&#x1F4DA; Study &ldquo;Still learning&rdquo; again</button>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <div id="modalContent"></div>
    </div>
  </div>

      { unit: "Unit 3: Age of Exploration", term: "RACED", def: "Reconnaissance, Assets, Christianity, Empire building, Dominance — reasons for exploration" },
      { unit: "Unit 3: Age of Exploration", term: "Which country was first and most impactful in colonizing the Americas?", def: "Spain" },
      { unit: "Unit 3: Age of Exploration", term: "Mercantilism", def: "Economic theory that colonies exist to provide wealth to the mother country" },
      { unit: "Unit 3: Age of Exploration", term: "Hernán Cortés", def: "Spanish conquistador who conquered the Aztecs" },
      { unit: "Unit 3: Age of Exploration", term: "Francisco Pizarro", def: "Spanish conquistador who conquered the Incas" },
      { unit: "Unit 3: Age of Exploration", term: "Montezuma II", def: "Aztec emperor who was defeated by Cortés" },
      { unit: "Unit 3: Age of Exploration", term: "Atahualpa", def: "Inca emperor who was defeated by Pizarro" },
      { unit: "Unit 3: Age of Exploration", term: "Which country had the best interactions with natives?", def: "France" },

      // ── UNIT 4: Absolutism ──────────────────────────────────────────
      { unit: "Unit 4: Absolutism", term: "Absolute Power", def: "A ruler has total control over the people with no limits" },
      { unit: "Unit 4: Absolutism", term: "Characteristics of absolute monarchs", def: "Large armies, strong central power, and control of the economy" },
      { unit: "Unit 4: Absolutism", term: "How did the Reformation lead to absolute monarchs?", def: "Religious wars made people want strong rulers for stability" },
      { unit: "Unit 4: Absolutism", term: "Divine Right of Kings", def: "Belief that God gave the king his power, justifying absolute rule" },
      { unit: "Unit 4: Absolutism", term: "Centralized Government", def: "All power flows from one central authority" },
      { unit: "Unit 4: Absolutism", term: "Louis XIV", def: "Absolute monarch of France" },
      { unit: "Unit 4: Absolutism", term: "Elizabeth I", def: "Queen of England who strengthened Anglican culture" },
      { unit: "Unit 4: Absolutism", term: "Peter the Great", def: "Absolute monarch of Russia who Westernized the country" },
      { unit: "Unit 4: Absolutism", term: "Philip II", def: "Absolute monarch of Spain" },
      { unit: "Unit 4: Absolutism", term: "Limited Monarchy", def: "A monarchy where the king's power is restricted by laws" },
      { unit: "Unit 4: Absolutism", term: "Westernization", def: "Peter the Great modernized Russia by adopting Western laws, customs, dress, and technology" },

      // ── UNIT 5: Scientific Revolution ───────────────────────────────
      { unit: "Unit 5: Scientific Revolution", term: "Francis Bacon", def: "Developed the scientific method based on observation and experimentation" },
      { unit: "Unit 5: Scientific Revolution", term: "René Descartes", def: "\"I think, therefore I am\" — emphasized reason as the basis for knowledge" },
      { unit: "Unit 5: Scientific Revolution", term: "Isaac Newton", def: "Discovered the laws of gravity and motion" },
      { unit: "Unit 5: Scientific Revolution", term: "Galileo", def: "Used the telescope to observe the sky and support the heliocentric model" },
      { unit: "Unit 5: Scientific Revolution", term: "Copernicus", def: "First proposed the heliocentric theory" },
      { unit: "Unit 5: Scientific Revolution", term: "Heliocentric Theory", def: "The Earth and planets revolve around the Sun" },
      { unit: "Unit 5: Scientific Revolution", term: "Scientific Method", def: "Observation → Hypothesis → Experiment → Conclusion" },

      // ── UNIT 5: Enlightenment ───────────────────────────────────────
      { unit: "Unit 5: Enlightenment", term: "Hobbes", def: "Humans are naturally selfish — believed people need a strong government to control them" },
      { unit: "Unit 5: Enlightenment", term: "Locke", def: "People have natural rights — government must have the consent of the governed" },
      { unit: "Unit 5: Enlightenment", term: "Rousseau", def: "People are naturally good — society corrupts them" },
      { unit: "Unit 5: Enlightenment", term: "Montesquieu", def: "Government should have separation of powers to prevent tyranny" },
      { unit: "Unit 5: Enlightenment", term: "Beccaria", def: "Against torture and cruel punishments" },
      { unit: "Unit 5: Enlightenment", term: "Adam Smith", def: "Father of capitalism and the free market" },
      { unit: "Unit 5: Enlightenment", term: "The Social Contract", def: "Agreement between the people and government — people give up some freedom in exchange for protection" },

      // ── UNIT 5: American Revolution ─────────────────────────────────
      { unit: "Unit 5: American Revolution", term: "Thomas Jefferson", def: "Wrote the Declaration of Independence" },
      { unit: "Unit 5: American Revolution", term: "Bill of Rights", def: "First 10 amendments to the U.S. Constitution — protected individual freedoms" },
      { unit: "Unit 5: American Revolution", term: "Causes of the American Revolution", def: "Taxation without representation" },
      { unit: "Unit 5: American Revolution", term: "King George III", def: "British king who refused to address the colonists' complaints" },
      { unit: "Unit 5: American Revolution", term: "George Washington", def: "Led the Continental Army and became the first President of the United States" },

      // ── UNIT 5: French Revolution ───────────────────────────────────
      { unit: "Unit 5: French Revolution", term: "Causes of the French Revolution", def: "Inequality between the estates and France going bankrupt from wars" },
      { unit: "Unit 5: French Revolution", term: "Estates-General", def: "Meeting of all three estates called by Louis XVI" },
      { unit: "Unit 5: French Revolution", term: "National Assembly", def: "The Third Estate broke away and formed their own government" },
      { unit: "Unit 5: French Revolution", term: "Jacobins", def: "Radical revolutionary group that led the Reign of Terror" },
      { unit: "Unit 5: French Revolution", term: "1st, 2nd, and 3rd Estate", def: "1st: Clergy | 2nd: Nobles | 3rd: Everyone else — who paid all the taxes" },
      { unit: "Unit 5: French Revolution", term: "Old Regime", def: "The pre-revolution social and political system in France" },
      { unit: "Unit 5: French Revolution", term: "Deficit Spending", def: "Government spending more money than it earns" },
      { unit: "Unit 5: French Revolution", term: "King Louis XVI", def: "Weak French king during the Revolution" },
      { unit: "Unit 5: French Revolution", term: "Marie Antoinette", def: "Queen of France during the Revolution" },
      { unit: "Unit 5: French Revolution", term: "Robespierre", def: "Led the Reign of Terror — was eventually executed himself" },
      { unit: "Unit 5: French Revolution", term: "Guillotine", def: "Device used for beheadings during the French Revolution" },
      { unit: "Unit 5: French Revolution", term: "Reign of Terror", def: "Period during the French Revolution when thousands were executed" },
      { unit: "Unit 5: French Revolution", term: "Napoleon", def: "Military general who took power after the Revolution — conquered much of Europe and spread French laws and ideas" },
    ];

    // ── Card identity key (survives shuffle + filter changes) ──────────
    function cardKey(c) { return c.unit + '|' + c.term; }

    // ── Build unit list ─────────────────────────────────────────────────
    const unitOrder = [];
    ALL_CARDS.forEach(c => { if (!unitOrder.includes(c.unit)) unitOrder.push(c.unit); });

    // ── State ───────────────────────────────────────────────────────────
    let globalStatus = {};   // keyed by cardKey — persists across filter changes
    let activeUnits  = new Set(unitOrder);
    let quickSetActive = false;
    let cards  = [];
    let index  = 0;
    let flipped = false;

    // ── LocalStorage ────────────────────────────────────────────────────
    const LS_AUTO    = 'fc_autosave';
    const LS_PRESETS = 'fc_presets';

    function autoSave() {
      localStorage.setItem(LS_AUTO, JSON.stringify({
        globalStatus,
        activeUnits: [...activeUnits],
        quickSetActive,
        index
      }));
      flashSaved();
    }

    function flashSaved() {
      const el = document.getElementById('saveIndicator');
      el.classList.add('visible');
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove('visible'), 1800);
    }

    function loadAutoSave() {
      try {
        const raw = localStorage.getItem(LS_AUTO);
        if (!raw) return false;
        const s = JSON.parse(raw);
        globalStatus = s.globalStatus || {};
        if (s.quickSetActive) {
          quickSetActive = true;
          activeUnits = new Set();
        } else {
          quickSetActive = false;
          const saved = (s.activeUnits || []).filter(u => unitOrder.includes(u));
          activeUnits = saved.length ? new Set(saved) : new Set(unitOrder);
        }
        const savedIdx = s.index || 0;
        applyFilter(false);
        index = Math.min(savedIdx, cards.length - 1);
        render();
        return true;
      } catch(e) { return false; }
    }

    // ── Presets ─────────────────────────────────────────────────────────
    function getPresets() {
      try { return JSON.parse(localStorage.getItem(LS_PRESETS) || '[]'); } catch(e) { return []; }
    }
    function savePresets(arr) { localStorage.setItem(LS_PRESETS, JSON.stringify(arr)); }

    function savePreset(name) {
      const knowN = cards.filter(c => globalStatus[cardKey(c)] === 'know').length;
      const learnN = cards.filter(c => globalStatus[cardKey(c)] === 'learn').length;
      const presets = getPresets();
      presets.unshift({
        id: Date.now(),
        name,
        date: new Date().toLocaleDateString(),
        time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}),
        globalStatus: {...globalStatus},
        activeUnits: [...activeUnits],
        quickSetActive,
        index,
        knowN, learnN,
        total: cards.length
      });
      savePresets(presets);
    }

    function loadPreset(preset) {
      globalStatus = {...preset.globalStatus};
      if (preset.quickSetActive) {
        quickSetActive = true;
        activeUnits = new Set();
      } else {
        quickSetActive = false;
        const valid = (preset.activeUnits || []).filter(u => unitOrder.includes(u));
        activeUnits = valid.length ? new Set(valid) : new Set(unitOrder);
      }
      applyFilter(false);
      index = Math.min(preset.index || 0, cards.length - 1);
      render();
      refreshPills();
      autoSave();
      closeModal();
    }

    function deletePreset(id) {
      savePresets(getPresets().filter(p => p.id !== id));
      renderPresetsModal();
    }

    // ── Filter pills ─────────────────────────────────────────────────────
    const filtersEl = document.getElementById('filters');

    function buildPills() {
      filtersEl.innerHTML = '';

      const qsPill = document.createElement('div');
      qsPill.className = 'pill quickset' + (quickSetActive ? ' active' : '');
      qsPill.textContent = '⭐ Enlightenment Quick Set';
      qsPill.onclick = () => {
        quickSetActive = !quickSetActive;
        activeUnits = quickSetActive ? new Set() : new Set(unitOrder);
        refreshPills(); applyFilter();
      };
      filtersEl.appendChild(qsPill);

      const allPill = document.createElement('div');
      allPill.className = 'pill' + (!quickSetActive && activeUnits.size === unitOrder.length ? ' active' : '');
      allPill.textContent = 'All';
      allPill.onclick = () => {
        quickSetActive = false; activeUnits = new Set(unitOrder);
        refreshPills(); applyFilter();
      };
      filtersEl.appendChild(allPill);

      unitOrder.forEach(u => {
        const p = document.createElement('div');
        p.className = 'pill' + (!quickSetActive && activeUnits.has(u) ? ' active' : '');
        p.textContent = u.replace('Unit ', 'U').replace(': ', ' – ');
        p.onclick = () => {
          quickSetActive = false;
          if (activeUnits.has(u)) { if (activeUnits.size === 1) return; activeUnits.delete(u); }
          else activeUnits.add(u);
          refreshPills(); applyFilter();
        };
        filtersEl.appendChild(p);
      });
    }

    function refreshPills() {
      const pills = filtersEl.querySelectorAll('.pill');
      pills[0].className = 'pill quickset' + (quickSetActive ? ' active' : '');
      pills[1].className = 'pill' + (!quickSetActive && activeUnits.size === unitOrder.length ? ' active' : '');
      unitOrder.forEach((u, i) => {
        pills[i + 2].className = 'pill' + (!quickSetActive && activeUnits.has(u) ? ' active' : '');
      });
    }

    // clearGlobalStatus=true only when explicitly clearing; false preserves marks
    function applyFilter(clearGlobalStatus = false) {
      cards = quickSetActive ? [...QUICK_SET] : ALL_CARDS.filter(c => activeUnits.has(c.unit));
      if (clearGlobalStatus) globalStatus = {};
      index = 0;
      // Restore done screen if visible
      document.getElementById('main').style.display = '';
      document.getElementById('doneScreen').classList.remove('visible');
      render();
    }

    // ── Card rendering ────────────────────────────────────────────────────
    function render() {
      if (cards.length === 0) return;
      const card = cards[index];
      document.getElementById('unitTag').textContent = card.unit;
      document.getElementById('term').textContent = card.term;
      document.getElementById('def').textContent = card.def;
      document.getElementById('counter').textContent = `${index + 1} / ${cards.length}`;
      document.getElementById('prevBtn').disabled = index === 0;
      document.getElementById('nextBtn').disabled = index === cards.length - 1;
      flipped = false;
      document.getElementById('card').classList.remove('flipped');
      updateScoreDisplay();
      renderDots();
    }

    function updateScoreDisplay() {
      const knowN = cards.filter(c => globalStatus[cardKey(c)] === 'know').length;
      const learnN = cards.filter(c => globalStatus[cardKey(c)] === 'learn').length;
      document.getElementById('knowCount').textContent = knowN;
      document.getElementById('learnCount').textContent = learnN;
    }

    function renderDots() {
      const prog = document.getElementById('progress');
      prog.innerHTML = '';
      cards.forEach((c, i) => {
        const d = document.createElement('div');
        const st = globalStatus[cardKey(c)];
        let cls = 'dot';
        if (i === index) cls += ' current';
        else if (st === 'know') cls += ' know';
        else if (st === 'learn') cls += ' learn';
        d.className = cls;
        prog.appendChild(d);
      });
    }

    function flipCard() {
      flipped = !flipped;
      document.getElementById('card').classList.toggle('flipped');
    }

    function markCard(known) {
      globalStatus[cardKey(cards[index])] = known ? 'know' : 'learn';
      autoSave();
      updateScoreDisplay();
      renderDots();
      const next = index + 1;
      if (next < cards.length) { index = next; render(); }
      else showDone();
    }

    function navigate(dir) {
      const next = index + dir;
      if (next >= 0 && next < cards.length) { index = next; render(); }
    }

    function shuffle() {
      for (let i = cards.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cards[i], cards[j]] = [cards[j], cards[i]];
      }
      // Start at first unmarked card, or 0
      const first = cards.findIndex(c => !globalStatus[cardKey(c)]);
      index = first >= 0 ? first : 0;
      render();
      autoSave();
    }

    function showDone() {
      const knowN = cards.filter(c => globalStatus[cardKey(c)] === 'know').length;
      const learnN = cards.filter(c => globalStatus[cardKey(c)] === 'learn').length;
      document.getElementById('main').style.display = 'none';
      document.getElementById('doneScreen').classList.add('visible');
      document.getElementById('doneStats').innerHTML =
        `<span style="color:#4ade80">&#10003; Know it: ${knowN}</span><br>` +
        `<span style="color:#fb923c">&#x2715; Still learning: ${learnN}</span>`;
      document.querySelector('.study-again-btn').style.display = learnN > 0 ? '' : 'none';
    }

    function restart(onlyLearning) {
      document.getElementById('main').style.display = '';
      document.getElementById('doneScreen').classList.remove('visible');
      if (onlyLearning) {
        // Keep only 'still learning' cards; clear their marks so you re-study them fresh
        const learnCards = cards.filter(c => globalStatus[cardKey(c)] === 'learn');
        learnCards.forEach(c => delete globalStatus[cardKey(c)]);
        cards = learnCards;
      } else {
        // Restore full set, keep all marks
        cards = quickSetActive ? [...QUICK_SET] : ALL_CARDS.filter(c => activeUnits.has(c.unit));
      }
      index = 0;
      render();
      autoSave();
    }

    // ── Modal ─────────────────────────────────────────────────────────────
    function openSaveModal() {
      const def = `Session – ${new Date().toLocaleDateString()}`;
      document.getElementById('modalContent').innerHTML = `
        <div class="modal-title">&#x1F4BE; Save Progress</div>
        <p style="font-size:0.85rem;color:#aaa;margin-bottom:14px;">Give this snapshot a name so you can load it later.</p>
        <input id="presetNameInput" type="text" value="${def}"
          style="width:100%;padding:10px 14px;border-radius:10px;border:1.5px solid #4f46e5;background:#1a1a2e;color:#eee;font-size:0.95rem;outline:none;margin-bottom:14px;">
        <div style="display:flex;gap:10px;justify-content:flex-end;">
          <button onclick="closeModal()" style="background:#2d2d50;border:none;color:#aaa;padding:9px 18px;border-radius:9px;cursor:pointer;">Cancel</button>
          <button onclick="confirmSavePreset()" style="background:#4f46e5;border:none;color:#fff;padding:9px 18px;border-radius:9px;cursor:pointer;font-weight:600;">Save</button>
        </div>`;
      document.getElementById('modalOverlay').classList.add('visible');
      setTimeout(() => document.getElementById('presetNameInput').select(), 60);
    }

    function confirmSavePreset() {
      const name = (document.getElementById('presetNameInput').value || '').trim() || 'My Session';
      savePreset(name);
      closeModal();
      flashSaved();
    }

    function openPresetsModal() {
      renderPresetsModal();
      document.getElementById('modalOverlay').classList.add('visible');
    }

    function renderPresetsModal() {
      const presets = getPresets();
      window._presets = presets;
      let body = presets.length === 0
        ? `<p style="color:#888;text-align:center;padding:20px 0;">No saved presets yet.<br>Hit <strong>&#x1F4BE; Save Preset</strong> to save your progress.</p>`
        : presets.map(p => `
            <div class="preset-item">
              <div class="preset-info">
                <div class="preset-name">${p.name}</div>
                <div class="preset-meta">${p.date} ${p.time||''} &bull; ${p.total} cards &bull; <span style="color:#4ade80">&#10003;${p.knowN}</span> <span style="color:#fb923c">&#x2715;${p.learnN}</span></div>
              </div>
              <div class="preset-actions">
                <button class="preset-load-btn" onclick="loadPreset(window._presets.find(x=>x.id===${p.id}))">Load</button>
                <button class="preset-del-btn" onclick="deletePreset(${p.id})">&#x1F5D1;</button>
              </div>
            </div>`).join('');

      document.getElementById('modalContent').innerHTML = `
        <div class="modal-title">&#x1F4C2; My Saved Presets</div>
        ${body}
        <div style="margin-top:18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
          <button onclick="promptClearMarks()" style="background:#431407;border:1.5px solid #f97316;color:#fb923c;padding:8px 14px;border-radius:9px;cursor:pointer;font-size:0.8rem;">&#x1F5D1; Clear current marks</button>
          <button onclick="closeModal()" style="background:#2d2d50;border:none;color:#aaa;padding:9px 18px;border-radius:9px;cursor:pointer;">Close</button>
        </div>`;
    }

    function promptClearMarks() {
      if (!confirm('Clear all progress marks for the current card set? Your saved presets will not be affected.')) return;
      cards.forEach(c => delete globalStatus[cardKey(c)]);
      index = 0;
      render();
      autoSave();
      closeModal();
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('visible');
    }

    // ── Init ──────────────────────────────────────────────────────────────
    buildPills();
    if (!loadAutoSave()) applyFilter();
  </script>
</body>
</html>
